<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autobiographical Game | Vasiliki Hadzikosta</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f3ed}body{display:flex;align-items:center;justify-content:center}main{position:relative;flex:none;width:600px;height:600px;transform-origin:center}canvas{display:block}button{cursor:pointer}#p5_loading{font:12px Arial;padding:20px}</style><script src="../../assets/p5-1.4.1.min.js"></script><script src="../../assets/p5.sound.min.js"></script></head><body><main id="game"></main><script src="sketch.js"></script><script src="character.js"></script><script src="labyrinth.js"></script><script src="records.js"></script><script src="gallery.js"></script><script src="security.js"></script><script src="recordshelve.js"></script><script src="rectang.js"></script><script>const initialSetup=setup;setup=function(){initialSetup();document.querySelectorAll('body>button').forEach(b=>document.getElementById('game').append(b));fit();parent.postMessage({type:'vh-sketch-ready'},location.origin)};function fit(){document.getElementById('game').style.transform='scale('+Math.min(innerWidth/600,innerHeight/600)+')'}addEventListener('resize',fit);fit();addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});addEventListener('message',e=>{if(e.origin===location.origin&&e.data?.type==='vh-motion'){if(e.data.paused){noLoop();if(typeof musicTracks!=='undefined')musicTracks.forEach(s=>s.pause())}else loop()}});</script></body></html>
