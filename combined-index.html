<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Vasiliki Hadzikosta — two complementary portfolios: Design Engineer and Creative Technologist." />
  <meta name="theme-color" content="#0d0d0d" />
  <title>Vasiliki Hadzikosta — Choose a profile</title>
  <style>
    :root {
      --ink: #101010;
      --paper: #eeeae0;
      --orange: #ff4f24;
      --lime: #c9ff38;
      --blue: #3d4aff;
      --bar: 54px;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      --sans: Arial, Helvetica, sans-serif;
      --serif: Iowan Old Style, Baskerville, "Times New Roman", serif;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      background: var(--ink);
      color: white;
      font-family: var(--sans);
    }
    button { font: inherit; }
    ::selection { background: var(--lime); color: var(--ink); }

    .grain {
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none;
      opacity: .075;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .chooser {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--ink);
      transition: opacity .45s ease, visibility .45s;
    }
    .chooser.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    .masthead {
      position: absolute;
      inset: 0 0 auto;
      z-index: 5;
      height: 52px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 clamp(18px, 2.5vw, 40px);
      border-bottom: 1px solid rgba(255,255,255,.24);
      font: 10px/1 var(--mono);
      letter-spacing: .13em;
      text-transform: uppercase;
      pointer-events: none;
    }
    .masthead span:last-child { justify-self: end; }
    .masthead__mark { font-size: 14px; letter-spacing: .04em; }

    .choice {
      position: relative;
      border: 0;
      padding: 92px clamp(22px, 4vw, 70px) 34px;
      overflow: hidden;
      text-align: left;
      cursor: pointer;
      isolation: isolate;
    }
    .choice::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      opacity: 0;
      transition: opacity .35s ease;
    }
    .choice:hover::after, .choice:focus-visible::after { opacity: 1; }
    .choice:focus-visible { outline: 3px solid var(--lime); outline-offset: -3px; }

    .choice--engineer {
      color: #e9ffe2;
      background-color: #0a130d;
      background-image:
        linear-gradient(rgba(111,255,118,.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(111,255,118,.08) 1px, transparent 1px);
      background-size: 34px 34px;
    }
    .choice--engineer::after {
      background: radial-gradient(circle at 48% 46%, rgba(101,255,122,.18), transparent 55%);
    }
    .choice--creative {
      color: var(--ink);
      background: var(--orange);
    }
    .choice--creative::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(circle at 76% 18%, var(--lime) 0 8%, transparent 8.2%),
        linear-gradient(135deg, transparent 54%, rgba(61,74,255,.92) 54.2% 74%, transparent 74.2%),
        repeating-radial-gradient(circle at 78% 80%, rgba(16,16,16,.15) 0 1px, transparent 1px 12px);
      transition: transform .65s cubic-bezier(.2,.75,.2,1);
    }
    .choice--creative:hover::before { transform: scale(1.08) rotate(-1deg); }
    .choice--creative::after { background: rgba(255,255,255,.12); }

    .choice__top {
      position: absolute;
      top: 76px;
      left: clamp(22px, 4vw, 70px);
      right: clamp(22px, 4vw, 70px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font: 10px/1 var(--mono);
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .choice__status { display: flex; align-items: center; gap: 9px; }
    .choice__status::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 14px currentColor;
    }
    .choice__number { opacity: .58; }

    .choice__body {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
    }
    .choice__kicker {
      margin: 0 0 18px;
      font: 11px/1.3 var(--mono);
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .choice__title {
      margin: 0;
      font-size: clamp(54px, 7.4vw, 132px);
      line-height: .78;
      letter-spacing: -.075em;
      text-transform: uppercase;
      transition: transform .4s cubic-bezier(.2,.75,.2,1);
    }
    .choice:hover .choice__title { transform: translateX(8px); }
    .choice--engineer .choice__title { font-family: var(--mono); font-weight: 700; letter-spacing: -.09em; }
    .choice--creative .choice__title { font-weight: 900; }
    .choice--creative .choice__title em {
      display: block;
      margin-left: .34em;
      color: transparent;
      font-family: var(--serif);
      font-weight: 400;
      -webkit-text-stroke: 1.5px var(--ink);
    }
    .choice__copy {
      max-width: 440px;
      margin: 28px 0 0;
      font-size: clamp(16px, 1.5vw, 22px);
      line-height: 1.15;
    }
    .choice--engineer .choice__copy { font-family: var(--mono); font-size: clamp(13px, 1.15vw, 17px); line-height: 1.5; }
    .choice--creative .choice__copy { font-family: var(--serif); font-size: clamp(19px, 1.75vw, 29px); }

    .choice__enter {
      position: absolute;
      left: clamp(22px, 4vw, 70px);
      right: clamp(22px, 4vw, 70px);
      bottom: 34px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 15px;
      border-top: 1px solid currentColor;
      font: 10px/1 var(--mono);
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .choice__arrow {
      display: inline-block;
      font-size: 21px;
      transition: transform .25s ease;
    }
    .choice:hover .choice__arrow { transform: translateX(9px); }

    .seam {
      position: absolute;
      z-index: 6;
      top: 50%;
      left: 50%;
      width: 92px;
      height: 92px;
      transform: translate(-50%, -50%) rotate(45deg);
      display: grid;
      place-items: center;
      background: var(--paper);
      color: var(--ink);
      border: 2px solid var(--ink);
      pointer-events: none;
      box-shadow: 7px 7px 0 rgba(0,0,0,.3);
    }
    .seam span { transform: rotate(-45deg); font: 20px/1 var(--mono); }

    .viewer {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: var(--ink);
      opacity: 0;
      visibility: hidden;
      transition: opacity .45s ease, visibility .45s;
    }
    .viewer.is-active { opacity: 1; visibility: visible; }
    .profilebar {
      height: var(--bar);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      border-bottom: 1px solid #333;
      background: #0d0d0d;
      color: white;
      padding: 0 12px;
      font: 10px/1 var(--mono);
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .profilebar__home,
    .profilebar__tab {
      appearance: none;
      border: 1px solid #3d3d3d;
      color: inherit;
      background: transparent;
      cursor: pointer;
      font: inherit;
      letter-spacing: inherit;
      text-transform: inherit;
    }
    .profilebar__home { justify-self: start; width: 32px; height: 30px; font-size: 17px; }
    .profilebar__tabs { display: flex; gap: 6px; }
    .profilebar__tab { padding: 9px 14px; }
    .profilebar__tab.is-active { background: white; color: var(--ink); border-color: white; }
    .profilebar__label { justify-self: end; color: #888; }
    .profilebar button:hover, .profilebar button:focus-visible { border-color: var(--lime); outline: none; }
    .profileframe {
      display: block;
      width: 100%;
      height: calc(100% - var(--bar));
      border: 0;
      background: white;
    }

    @media (max-width: 760px) {
      :root { --bar: 48px; }
      .chooser { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
      .masthead { height: 38px; padding: 0 max(14px, env(safe-area-inset-right)) 0 max(14px, env(safe-area-inset-left)); grid-template-columns: 1fr auto; font-size: 8px; }
      .masthead__mark { justify-self: end; font-size: 8px; letter-spacing: .02em; }
      .masthead span:last-child { display: none; }
      .choice { padding: 50px 16px 16px; }
      .choice__top { top: 46px; left: 16px; right: 16px; font-size: 8px; }
      .choice__kicker { margin-bottom: 11px; font-size: 8px; }
      .choice__title { font-size: clamp(39px, 12.5vw, 64px); line-height: .81; }
      .choice__copy { display: none; }
      .choice__enter { left: 16px; right: 16px; bottom: 14px; padding-top: 8px; font-size: 8px; }
      .seam { width: 52px; height: 52px; }
      .seam span { font-size: 12px; }
      .profilebar { grid-template-columns: auto 1fr; padding: 0 max(6px, env(safe-area-inset-right)) 0 max(6px, env(safe-area-inset-left)); gap: 6px; }
      .profilebar__tabs { justify-self: stretch; }
      .profilebar__home { width: 34px; min-height: 36px; }
      .profilebar__tab { flex: 1; min-height: 36px; padding: 7px 4px; font-size: 8px; letter-spacing: .06em; }
      .profilebar__label { display: none; }
    }

    @media (max-width: 760px) and (max-height: 520px) and (orientation: landscape) {
      .chooser { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
      .choice__title { font-size: clamp(34px, 7vw, 64px); }
      .seam { width: 46px; height: 46px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <main class="chooser" id="chooser" aria-label="Choose a portfolio profile">
    <header class="masthead">
      <span>Vasiliki Hadzikosta</span>
      <span class="masthead__mark">VH / CHOOSE YOUR FREQUENCY</span>
      <span>Paris · France</span>
    </header>

    <button class="choice choice--engineer" type="button" data-profile="engineer" aria-label="Enter the Design Engineer profile">
      <span class="choice__top">
        <span class="choice__status">System online</span>
        <span class="choice__number">Mode / Logic</span>
      </span>
      <span class="choice__body">
        <span class="choice__kicker">Systems with a pulse</span>
        <span class="choice__title">Design<br />Engineer</span>
        <span class="choice__copy">Ideas engineered to hold: products, interfaces and spatial systems built from first principle to final pixel.</span>
      </span>
      <span class="choice__enter"><span>Tune into logic</span><span class="choice__arrow">→</span></span>
    </button>

    <button class="choice choice--creative" type="button" data-profile="creative" aria-label="Enter the Artsy Creative Tech profile">
      <span class="choice__top">
        <span class="choice__status">Studio open</span>
        <span class="choice__number">Mode / Wonder</span>
      </span>
      <span class="choice__body">
        <span class="choice__kicker">Make the machine dream</span>
        <span class="choice__title">Creative <em>Tech</em></span>
        <span class="choice__copy">Where code slips its leash—moving image, playable worlds and experiments tuned for surprise.</span>
      </span>
      <span class="choice__enter"><span>Tune into wonder</span><span class="choice__arrow">→</span></span>
    </button>

    <div class="seam" aria-hidden="true"><span>↔</span></div>
  </main>

  <section class="viewer" id="viewer" aria-label="Selected portfolio profile">
    <nav class="profilebar" aria-label="Portfolio profiles">
      <button class="profilebar__home" id="homeButton" type="button" aria-label="Return to profile chooser">×</button>
      <div class="profilebar__tabs">
        <button class="profilebar__tab" type="button" data-profile="engineer">Design Engineer</button>
        <button class="profilebar__tab" type="button" data-profile="creative">Creative Tech</button>
      </div>
      <span class="profilebar__label">One mind · two operating modes</span>
    </nav>
    <iframe class="profileframe" id="profileFrame" title="Vasiliki Hadzikosta portfolio" loading="eager"></iframe>
  </section>

  <script>
    const profiles = {
      engineer: {
        src: "profile-design-engineer.html",
        title: "Vasiliki Hadzikosta — Design Engineer"
      },
      creative: {
        src: "profile-creative-tech.html",
        title: "Vasiliki Hadzikosta — Creative Technologist"
      }
    };

    const chooser = document.getElementById("chooser");
    const viewer = document.getElementById("viewer");
    const frame = document.getElementById("profileFrame");
    const homeButton = document.getElementById("homeButton");
    const profileButtons = document.querySelectorAll("[data-profile]");
    const tabs = document.querySelectorAll(".profilebar__tab");

    function setProfile(name, updateHistory = true) {
      const profile = profiles[name];
      if (!profile) return showChooser(updateHistory);

      if (!frame.src.endsWith(profile.src)) frame.src = profile.src;
      tabs.forEach(tab => tab.classList.toggle("is-active", tab.dataset.profile === name));
      chooser.classList.add("is-hidden");
      viewer.classList.add("is-active");
      document.title = profile.title;

      if (updateHistory) {
        const url = new URL(window.location.href);
        url.searchParams.set("profile", name);
        history.pushState({ profile: name }, "", url);
      }
    }

    function showChooser(updateHistory = true) {
      viewer.classList.remove("is-active");
      chooser.classList.remove("is-hidden");
      tabs.forEach(tab => tab.classList.remove("is-active"));
      document.title = "Vasiliki Hadzikosta — Choose a profile";

      if (updateHistory) {
        const url = new URL(window.location.href);
        url.searchParams.delete("profile");
        history.pushState({}, "", url);
      }
    }

    profileButtons.forEach(button => {
      button.addEventListener("click", () => setProfile(button.dataset.profile));
    });
    homeButton.addEventListener("click", () => showChooser());
    window.addEventListener("keydown", event => {
      if (event.key === "Escape" && viewer.classList.contains("is-active")) showChooser();
    });
    window.addEventListener("popstate", () => {
      const name = new URL(window.location.href).searchParams.get("profile");
      name ? setProfile(name, false) : showChooser(false);
    });

    const initial = new URL(window.location.href).searchParams.get("profile");
    if (profiles[initial]) setProfile(initial, false);
  </script>
</body>
</html>
